<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in – Student Biodata</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-card">
  <h1>Log in</h1>
  <p>Log in to access the student biodata form.</p>

  {% if errors %}
  <div class="form-status" data-type="error" role="alert">
    <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
  </div>
  {% endif %}

  <form action="{{ url_for('login') }}" method="POST">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="254"
           autocomplete="email" value="{{ email }}">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required
           autocomplete="current-password">

    <div class="actions">
      <button type="submit" class="primary">Log in</button>
    </div>
  </form>

  <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</main>
</body>
</html>
