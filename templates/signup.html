<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up – Student Biodata</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-card">
  <h1>Create an account</h1>
  <p>Sign up to access the student biodata form.</p>

  {% if errors %}
  <div class="form-status" data-type="error" role="alert">
    <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
  </div>
  {% endif %}

  <form action="{{ url_for('signup') }}" method="POST">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="254"
           autocomplete="email" value="{{ email }}">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8"
           maxlength="128" autocomplete="new-password">

    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" name="confirm_password" type="password"
           required minlength="8" maxlength="128" autocomplete="new-password">

    <div class="actions">
      <button type="submit" class="primary">Sign up</button>
    </div>
  </form>

  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</main>
</body>
</html>
